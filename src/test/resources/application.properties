# Test configuration: in-memory H2 in MySQL compatibility mode.
# This file shadows the main application.properties on the test classpath,
# so tests never touch a real MySQL instance or the dev/prod profiles.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.default-property-inclusion=non_null
