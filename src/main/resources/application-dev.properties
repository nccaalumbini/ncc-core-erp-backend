# =========================================================
# Development profile
# =========================================================
# Local database. Override DB_URL/DB_USERNAME/DB_PASSWORD via environment
# variables or your IDE run configuration when they differ.
#
# useInformationSchema=false makes MySQL Connector/J read metadata through the
# legacy SHOW statements instead of INFORMATION_SCHEMA. This lets Hibernate
# auto-detect the dialect without pinning spring.jpa.database-platform, and it
# avoids the "Unknown column 'RESERVED'" warning on MariaDB 11+ (whose
# INFORMATION_SCHEMA.KEYWORDS dropped that column). MySQL 8 works either way;
# the prod profile is left untouched.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ncc_core_erp?useInformationSchema=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
# "update" is convenient for local development; production uses "validate".
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Logging
# =========================================================
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.com.nccaa=debug
