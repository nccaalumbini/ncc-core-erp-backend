# =========================================================
# Production profile
# =========================================================
# All connectivity comes from environment variables; nothing is hard-coded.
# The database MUST be reachable from Render (managed MySQL), never localhost.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
# Never alter the production schema automatically. A migration tool such as
# Flyway must own schema changes before this reaches real production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# Logging
# =========================================================
# No SQL or bind-parameter logging in production (avoids leaking data).
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.com.nccaa=info
