# =========================================================
# Application
# =========================================================
spring.application.name=ncc-core-erp-backend
application.version=0.0.1-SNAPSHOT

# Render (and most PaaS providers) inject the port to bind to.
server.port=${PORT:8080}

# Active profile. Local runs default to "dev"; Render sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================================================
# Local .env loading
# =========================================================
# Spring Boot does NOT read a .env file on its own. This import makes a local
# .env (KEY=VALUE lines) available to ${...} placeholders such as DB_URL/
# DB_USERNAME/DB_PASSWORD. It is "optional", so it is simply skipped when the
# file is absent (e.g. on Render, where real environment variables are used
# instead). OS environment variables still override values from .env.
spring.config.import=optional:file:.env[.properties]

# =========================================================
# Database (environment-driven; see profile-specific files)
# =========================================================
# URL/username/password live in application-dev.properties and
# application-prod.properties and are always read from environment variables
# (or the local .env above). Do NOT hard-code credentials here.

# =========================================================
# JPA / Hibernate
# =========================================================
# The dialect is detected automatically from the JDBC connection metadata.
# Do not pin spring.jpa.database-platform / hibernate.dialect unless a concrete,
# reproduced problem requires it (Hibernate logs "does not need to be specified
# explicitly" when it is set).

# =========================================================
# JSON
# =========================================================
# Jackson 3 (Spring Boot 4) writes java.time values as ISO-8601 strings by
# default, e.g. 2026-10-05T10:00:00Z. Omit null fields from responses.
spring.jackson.default-property-inclusion=non_null

# =========================================================
# Actuator
# =========================================================
# Expose only the health endpoint; Render uses /actuator/health for health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
